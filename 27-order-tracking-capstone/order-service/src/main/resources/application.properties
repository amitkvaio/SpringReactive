server.port=8091
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:classroom}
spring.r2dbc.username=${DB_USER:student}
spring.r2dbc.password=${DB_PASSWORD}
spring.r2dbc.pool.initial-size=1
spring.r2dbc.pool.max-size=5
spring.r2dbc.pool.max-acquire-time=3s
spring.sql.init.mode=always
delivery.base-url=${DELIVERY_BASE_URL:http://localhost:8092}
management.endpoints.web.exposure.include=health,metrics
